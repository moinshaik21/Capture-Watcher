services:
  - type: web
    name: capture-watcher-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY            # generated for you; copy it from the Render dashboard
        generateValue: true
      - key: WATCHER_TZ         # the time zone your Excel times should be in
        value: Asia/Kolkata
      - key: ALLOWED_ORIGINS    # set to your Netlify address after you deploy it
        sync: false
